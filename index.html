<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rechnungen</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rechnungen">
<meta name="theme-color" content="#0b6b7f">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<style>
:root{--bg:#f3f6f7;--card:#fff;--ink:#14262e;--mute:#5b6c74;--line:#d5dee2;--acc:#0b6b7f;--accink:#fff;--err:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1a1f;--card:#17262d;--ink:#e6eef1;--mute:#93a5ad;--line:#2b3d46;--acc:#4fb4c8;--accink:#06222a;--err:#f2b8b5}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1a1f;--card:#17262d;--ink:#e6eef1;--mute:#93a5ad;--line:#2b3d46;--acc:#4fb4c8;--accink:#06222a;--err:#f2b8b5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,-apple-system,sans-serif;padding-bottom:96px}
main{max-width:640px;margin:0 auto;padding:20px 16px}
h1{font-size:26px;margin:4px 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 18px}
h2{font-size:17px;margin:0 0 12px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}
.f.w{grid-column:1/-1}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.chk{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:15px}
.chk input{width:22px;height:22px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700;width:100%;padding:14px;border-radius:10px}
.item{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.item:first-of-type{border-top:0;margin-top:0;padding-top:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lt{font-weight:700;font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
.tot .b{font-size:20px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.note{color:var(--mute);font-size:14px}
details{border-top:1px solid var(--line);padding:12px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;list-style:none}
summary .row b{font-variant-numeric:tabular-nums}
.lines{margin:10px 0;font-size:14px}
.lines div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 4px;color:var(--mute);font-weight:500}
nav button[aria-current="page"]{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
#toast{position:fixed;left:16px;right:16px;bottom:88px;max-width:608px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;display:none}
.seg{display:flex;gap:8px;margin-bottom:14px}.seg button{flex:1}
button[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
.danger{color:var(--err)}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status"></div>
<nav>
<button data-v="new">Neu</button>
<button data-v="list">Rechnungen</button>
<button data-v="stamm">Stamm</button>
<button data-v="firm">Firma</button>
</nav>

<script>
const KEY='rechnungen-app-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const de=d=>d?d.split('-').reverse().join('.'):'';
const eur=c=>(c/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const num=v=>+String(v).replace(',','.')||0;
let S={firm:{},inv:[],next:1,cust:[],art:[]};
try{const r=localStorage.getItem(KEY);if(r)Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let view='new',armed=-1,sub='cust',E={},eI=-1;
const item=()=>({d:'',q:'1',u:'Stk',p:'',v:S.firm.ku?0:19});
const draft=()=>({c:{},date:today(),sdate:today(),items:[item()]});
let D=draft();

const line=i=>Math.round(num(i.q)*num(i.p)*100);
function calc(items,ku){
  const g={};let net=0;
  items.forEach(i=>{const n=line(i),v=ku?0:+i.v;g[v]=(g[v]||0)+n;net+=n});
  const tax=Object.entries(g).map(([v,n])=>({v:+v,n,t:Math.round(n*v/100)}));
  const vat=tax.reduce((a,b)=>a+b.t,0);
  return{net,tax,vat,gross:net+vat};
}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)}

const f=(label,k,val,o={})=>`<label class="f ${o.w?'w':''}"><span>${label}</span><input data-k="${k}" value="${esc(val)}" ${o.t?`type="${o.t}"`:''} ${o.m?`inputmode="${o.m}"`:''} autocomplete="off"></label>`;

function viewFirm(){
  const F=S.firm;
  return `<h1>Firmendaten</h1><p class="sub">Diese Angaben erscheinen als Absender auf deinen Rechnungen. Sie bleiben auf diesem Gerät gespeichert.</p>
  <section><h2>Logo</h2>${S.logo?`<img src="${S.logo}" alt="Dein Logo" style="max-height:80px;max-width:100%;display:block;margin-bottom:12px">`:'<p class="note">Das Logo erscheint oben links auf deinen Rechnungen. Ohne Logo steht dort dein Firmenname.</p>'}
  <label class="f"><span>PNG oder JPG auswählen</span><input type="file" id="logo" accept="image/png,image/jpeg,image/webp"></label>${S.logo?'<button data-rmlogo style="margin-top:10px">Logo entfernen</button>':''}</section>
  <section><h2>Absender</h2><div class="g">
  ${f('Firmenname','firm.name',F.name,{w:1})}${f('Inhaber/in oder Ansprechpartner/in','firm.owner',F.owner,{w:1})}
  ${f('Straße und Hausnummer','firm.street',F.street,{w:1})}${f('PLZ','firm.zip',F.zip,{m:'numeric'})}${f('Ort','firm.city',F.city)}
  ${f('E-Mail','firm.mail',F.mail,{t:'email'})}${f('Telefon','firm.tel',F.tel,{t:'tel'})}</div></section>
  <section><h2>Steuer und Bank</h2><div class="g">
  <label class="f w chk"><input type="checkbox" data-k="firm.ku" ${F.ku?'checked':''}>Kleinunternehmer (§ 19 UStG, ohne Umsatzsteuer)</label>
  ${f('Steuernummer','firm.taxno',F.taxno)}${f('USt-IdNr.','firm.vatid',F.vatid)}
  ${f('Handelsregisternummer (falls vorhanden)','firm.reg',F.reg,{w:1})}
  ${f('IBAN','firm.iban',F.iban,{w:1})}${f('BIC','firm.bic',F.bic)}${f('Bank','firm.bank',F.bank)}</div></section>
  <section><h2>Voreinstellungen</h2><div class="g">
  ${f('Rechnungsnummer-Präfix','firm.prefix',F.prefix??'RE')}${f('Zahlungsziel in Tagen','firm.days',F.days??'14',{m:'numeric'})}</div></section>`;
}

function itemHtml(i,n){
  return `<div class="item"><div class="g">
  ${f('Beschreibung','i.'+n+'.d',i.d,{w:1})}
  ${f('Menge','i.'+n+'.q',i.q,{m:'decimal'})}${f('Einheit','i.'+n+'.u',i.u)}
  ${f('Einzelpreis netto in €','i.'+n+'.p',i.p,{m:'decimal'})}
  ${S.firm.ku?'':`<label class="f"><span>USt-Satz</span><select data-k="i.${n}.v">${[19,7,0].map(v=>`<option value="${v}" ${+i.v===v?'selected':''}>${v} %</option>`).join('')}</select></label>`}
  </div><div class="row" style="margin-top:8px"><span class="lt" data-line="${n}">${eur(line(i))}</span>${D.items.length>1?`<button data-rm="${n}">Position entfernen</button>`:''}</div></div>`;
}

function viewNew(){
  const C=D.c;
  return `<h1>Neue Rechnung</h1><p class="sub">Trage Kunde und Positionen ein, die Summen werden automatisch berechnet.</p>
  <section><h2>Kunde</h2>${pick('cust')}<div class="g">
  ${f('Name oder Firma','c.name',C.name,{w:1})}${f('Straße und Hausnummer','c.street',C.street,{w:1})}
  ${f('PLZ','c.zip',C.zip,{m:'numeric'})}${f('Ort','c.city',C.city)}${f('E-Mail','c.mail',C.mail,{t:'email',w:1})}</div></section>
  <section><h2>Datum</h2><div class="g">${f('Rechnungsdatum','d.date',D.date,{t:'date'})}${f('Leistungsdatum','d.sdate',D.sdate,{t:'date'})}</div></section>
  <section><h2>Positionen</h2>${pick('art')}${D.items.map(itemHtml).join('')}<button data-add style="margin-top:14px;width:100%">Position hinzufügen</button></section>
  <section class="tot" id="tot"></section>
  <button class="pri" data-save>Rechnung speichern</button>`;
}

function totalsHtml(){
  const c=calc(D.items,S.firm.ku);
  let h=`<div><span>Netto</span><span>${eur(c.net)}</span></div>`;
  if(S.firm.ku)h+=`<p class="note">Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.</p>`;
  else c.tax.forEach(x=>h+=`<div><span>USt ${x.v} % auf ${eur(x.n)}</span><span>${eur(x.t)}</span></div>`);
  return h+`<div class="b"><span>Gesamtbetrag</span><span>${eur(c.gross)}</span></div>`;
}
function totals(){
  const t=$('#tot');if(t)t.innerHTML=totalsHtml();
  document.querySelectorAll('[data-line]').forEach(e=>e.textContent=eur(line(D.items[e.dataset.line])));
}

const pick=t=>{const L=t==='cust'?S.cust:S.art;return L.length?`<label class="f" style="margin-bottom:12px"><span>${t==='cust'?'Aus Kundenstamm wählen':'Artikel aus Stamm hinzufügen'}</span><select data-pick="${t}"><option value="">Auswählen …</option>${L.map((x,n)=>`<option value="${n}">${esc(x.name||x.d)}</option>`).join('')}</select></label>`:''};
function viewStamm(){
  const cu=sub==='cust',L=cu?S.cust:S.art,ed=eI>=0;
  const form=cu?`${f('Name oder Firma','e.name',E.name,{w:1})}${f('Straße und Hausnummer','e.street',E.street,{w:1})}${f('PLZ','e.zip',E.zip,{m:'numeric'})}${f('Ort','e.city',E.city)}${f('E-Mail','e.mail',E.mail,{t:'email',w:1})}`
   :`${f('Bezeichnung','e.d',E.d,{w:1})}${f('Einheit','e.u',E.u??'Stk')}${f('Einzelpreis netto in €','e.p',E.p,{m:'decimal'})}${S.firm.ku?'':`<label class="f"><span>USt-Satz</span><select data-k="e.v">${[19,7,0].map(v=>`<option value="${v}" ${+(E.v??19)===v?'selected':''}>${v} %</option>`).join('')}</select></label>`}`;
  const list=L.map((x,n)=>`<div class="row item" style="flex-wrap:wrap"><span><b>${esc(cu?x.name:x.d)}</b><br><span class="note">${esc(cu?[x.street,[x.zip,x.city].filter(Boolean).join(' ')].filter(Boolean).join(', '):eur(Math.round(num(x.p)*100))+' / '+x.u+(S.firm.ku?'':' · '+x.v+' % USt'))}</span></span><span style="display:flex;gap:6px"><button data-sed="${n}">Bearbeiten</button><button class="danger" data-sdel="${n}">${armed==='s'+n?'Wirklich löschen?':'Löschen'}</button></span></div>`).join('');
  return `<h1>Stammdaten</h1><p class="sub">Kunden und Artikel, die du bei neuen Rechnungen mit einem Tipp übernehmen kannst.</p>
  <div class="seg"><button data-sub="cust" aria-pressed="${cu}">Kunden</button><button data-sub="art" aria-pressed="${!cu}">Artikel</button></div>
  <section><h2>${ed?(cu?'Kunde bearbeiten':'Artikel bearbeiten'):(cu?'Neuer Kunde':'Neuer Artikel')}</h2><div class="g">${form}</div>
  <div class="row" style="margin-top:12px;justify-content:flex-start;gap:8px"><button class="pri" style="width:auto;flex:1" data-sst>Speichern</button>${ed?'<button data-scancel>Abbrechen</button>':''}</div></section>

  }catch(e){if(e&&(e.code==='declined'||e.name==='AbortError'))return;toast('PDF konnte nicht erstellt werden.')}
}
render();
</script>
